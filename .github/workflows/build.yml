name: Build wtchet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP"/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          brew install ldid dpkg

      - name: Build Rootless package
        run: |
          make clean package

      - name: Verify package
        run: |
          test -f packages/com.reaaut.wtchet_0.1.0_iphoneos-arm64.deb
          dpkg-deb -f packages/com.reaaut.wtchet_0.1.0_iphoneos-arm64.deb Package Version Architecture

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: wtchet-0.1.0-deb
          path: packages/*.deb
          if-no-files-found: error
