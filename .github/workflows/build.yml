name: Build wtchet

concurrency:
  group: wtchet-main-build
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP"/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          brew install ldid dpkg

      - name: Build Rootless package
        run: |
          make clean package

      - name: Verify package
        run: |
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          echo "Built package: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture
          test "$(dpkg-deb -f "$DEB" Package)" = "com.reaaut.wtchet"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: wtchet-0.1.3-deb
          path: packages/*.deb
          if-no-files-found: error
